<!-- Search Container -->
<div class="search-container">
    <label class="sr-only" for="searchInput">Search services</label>
    <input type="search" id="searchInput" class="search-input" placeholder="Search services...">
    <span class="search-icon"><svg class="uvy-icon" aria-hidden="true" focusable="false"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
  <path d="M21 21l-6 -6" />
</svg>
</span>
</div>

<div class="provider-filter">
    <label for="providerFilter">Filter</label>
    <select id="providerFilter">
        <option value="all">All sites</option>
        <option value="okta">Okta</option>
        <option value="auth0">Auth0</option>
        <option value="salesforce">Salesforce</option>
        <option value="ping">ForgeRock / Ping</option>
        <option value="other">Other</option>
    </select>
</div>

<!-- Service Links -->
{{range .Services}}
<a class="service-link" data-providers="{{range .Providers}}{{.ID}} {{end}}" href="./service-{{.Id | urlquery}}.html" hx-get="./snippets/{{.Id | urlquery}}.html" hx-target="#content"
hx-push-url="./service-{{.Id | urlquery}}.html"><span class="service-name">{{.Name}}</span>{{if .Providers}}<span class="provider-icons">{{range .Providers}}<img class="provider-icon" src="./providers/{{.ID}}.svg" alt="" title="{{.Name}}"><span class="sr-only"> ({{.Name}})</span>{{end}}</span>{{end}}</a>
{{end}}
