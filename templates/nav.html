<nav aria-label="Services">
{{- range .Services}}
<a class="service-link" data-service-id="{{.Id}}" data-providers="{{range .Providers}}{{.ID}} {{end}}" href="./service-{{.Id | urlquery}}.html" hx-get="./snippets/{{.Id | urlquery}}.html" hx-target="#content" hx-push-url="./service-{{.Id | urlquery}}.html"><span class="service-name">{{.Name}}</span>{{if .Providers}}<span class="provider-icons">{{range .Providers}}<img class="provider-icon" src="./providers/{{.ID}}.svg" alt="" title="{{.Name}}" width="16" height="16"><span class="sr-only"> ({{.Name}})</span>{{end}}</span>{{end}}</a>
{{- end}}
</nav>
