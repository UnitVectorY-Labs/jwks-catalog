<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"]}'>
    <title>JWKS Catalog</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://unpkg.com/htmx.org@4.0.0/dist/htmx.min.js" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
        <a href="index.html" hx-get="./snippets/home.html" hx-target="#content" hx-push-url="index.html"><h1>JWKS Catalog</h1></a>
    </header>
    <div class="container">
        <!-- Left Navigation Panel -->
        <nav class="left-panel" hx-get="./nav.html" hx-trigger="load" hx-swap="innerHTML">
            <!-- Navigation will be loaded here via HTMX -->
        </nav>

        <!-- Right Content Panel -->
        <main class="right-panel" id="content">
            {{.Content}}
        </main>
    </div>
    <footer>
        <p>
            <a href="https://github.com/UnitVectorY-Labs">UnitVectorY Labs</a> | 
            <a href="https://opensource.org/licenses/MIT">MIT License</a> | 
            <a href="https://github.com/UnitVectorY-Labs/jwks-catalog"><strong>jwks-catalog</strong></a> and
            <a href="https://github.com/UnitVectorY-Labs/jwks-observer"><strong>jwks-observer</strong></a> on GitHub
        </p>
    </footer>

    <!-- JavaScript for Search Functionality -->
    <script>
    // Function to initialize search functionality
    function initializeSearch() {
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase();
                const links = document.querySelectorAll('.left-panel a');
                links.forEach(function(link) {
                    if (link.textContent.toLowerCase().includes(filter)) {
                        link.style.display = 'block';
                    } else {
                        link.style.display = 'none';
                    }
                });
            });
        }
    }

    // Initialize search when navigation is loaded
    document.body.addEventListener('htmx:after:swap', function(event) {
        if (event.target.classList.contains('left-panel')) {
            initializeSearch();
        }
    });

    // Also initialize on page load (fallback)
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(initializeSearch, 100);
    });

    // Mobile navigation toggle
    document.addEventListener('DOMContentLoaded', function() {
        var navToggle = document.getElementById('navToggle');
        var leftPanel = document.querySelector('.left-panel');
        if (navToggle && leftPanel) {
            navToggle.addEventListener('click', function() {
                leftPanel.classList.toggle('nav-open');
            });
            // Close nav when a link inside is clicked on mobile
            leftPanel.addEventListener('click', function(e) {
                if (e.target.tagName === 'A') {
                    leftPanel.classList.remove('nav-open');
                }
            });
        }
    });
    </script>
</body>
</html>
